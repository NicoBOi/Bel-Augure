<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Films pour hôtels, spas, thermes et maisons de bien-être. Deux réalisateurs, toute la chaîne. Bordeaux."
    />
    <meta name="theme-color" content="#f2ede4" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Bel Augure · Films pour hôtels, spas et maisons de bien-être · Bordeaux" />
    <meta
      property="og:description"
      content="Films pour hôtels, spas, thermes et maisons de bien-être. Deux réalisateurs, toute la chaîne. Bordeaux."
    />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="https://www.belaugure.studio/" />
    <meta property="og:image" content="https://www.belaugure.studio/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://www.belaugure.studio/og.png" />
    <link rel="canonical" href="https://www.belaugure.studio/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Données structurées : le studio comme service local, offres bornées -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Bel Augure",
        "description": "Films pour hôtels, spas, thermes et maisons de bien-être. Deux réalisateurs, toute la chaîne. Bordeaux.",
        "url": "https://www.belaugure.studio/",
        "email": "nicolas@belaugure.studio",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Bordeaux",
          "addressRegion": "Nouvelle-Aquitaine",
          "addressCountry": "FR"
        },
        "areaServed": "FR",
        "knowsAbout": [
          "film de marque",
          "film signature",
          "hôtellerie de luxe",
          "bien-être",
          "spa",
          "thermes"
        ]
      }
    </script>
    <!-- Vimeo : la connexion s'établit pendant que la page se charge,
         le film de fond démarre d'autant plus vite -->
    <link rel="preconnect" href="https://player.vimeo.com" />
    <link rel="preconnect" href="https://f.vimeocdn.com" />
    <link rel="preconnect" href="https://i.vimeocdn.com" />
    <link rel="dns-prefetch" href="https://fresnel.vimeocdn.com" />
    <link
      rel="preload"
      href="/fonts/giflika.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Bel Augure · Films pour hôtels, spas et maisons de bien-être · Bordeaux</title>
    <!-- Mesure d'audience : décommenter après avoir créé le site sur
         plausible.io (sans cookie, conforme à la politique de
         confidentialité annoncée dans les mentions légales).
    <script defer data-domain="belaugure.studio" src="https://plausible.io/js/script.js"></script>
    -->
  </head>
  <body>
    <!-- Voile d'ouverture statique : peint par le navigateur avant même que
         le bundle JS soit téléchargé. Sans lui, une connexion ou une machine
         lente voit un écran blanc au lieu de la salle obscure. React le
         remplace en montant (il vit dans #root) par son propre voile,
         visuellement identique. Sur les vues profondes (#offres…), il est
         masqué immédiatement : pas de voile hors accueil. -->
    <div id="root">
      <style>
        /* Même balayage que le voile React (load-sweep) : une attente
           indéterminée qui boucle, sans "remplissage" ni saut au passage
           du voile statique au voile React. */
        @keyframes belVeilSweep {
          from {
            transform: translateX(-100%);
          }
          to {
            transform: translateX(300%);
          }
        }
      </style>
      <div
        id="veil-static"
        style="position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; background: #1a1512"
      >
        <div style="display: flex; flex-direction: column; align-items: center">
          <p
            style="margin: 0; font-family: 'Giflika', 'Didot', 'Bodoni MT', Georgia, serif; font-size: clamp(1.6rem, 3vw, 2.4rem); color: #f2ede4"
          >
            Bel Augure<span style="color: #d9c6a6">.</span>
          </p>
          <span
            style="margin-top: 1.75rem; display: block; height: 1px; width: 11rem; overflow: hidden; background: rgba(242, 237, 228, 0.12)"
          >
            <span
              style="display: block; height: 100%; width: 50%; background: #d9c6a6; animation: belVeilSweep 1.8s cubic-bezier(0.16, 1, 0.3, 1) infinite"
            ></span>
          </span>
        </div>
      </div>
      <script>
        ;(function () {
          var views = ['films', 'offres', 'studio', 'contact', 'mentions']
          var path = location.pathname.replace(/\/+$/, '') || '/'
          var deep =
            path !== '/' || views.indexOf(location.hash.slice(1)) !== -1
          if (deep) {
            document.getElementById('veil-static').style.display = 'none'
          }
        })()
      </script>
      <!--seo-content-->
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
