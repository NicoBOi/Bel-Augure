<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Bel Augure, studio de films signature en Nouvelle-Aquitaine. Films pensés comme des actifs pour les grandes adresses du bien-être : spas, hôtels, cures thermales."
    />
    <meta name="theme-color" content="#f2ede4" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Bel Augure · Studio de films signature" />
    <meta
      property="og:description"
      content="Les films signatures du bien-être d'exception. Studio fondé à Bordeaux, Nouvelle-Aquitaine."
    />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="https://belaugure.studio/" />
    <meta property="og:image" content="https://belaugure.studio/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://belaugure.studio/og.png" />
    <link rel="canonical" href="https://belaugure.studio/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Données structurées : le studio comme service local, offres bornées -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Bel Augure",
        "description": "Studio de films signature pour les grandes adresses du bien-être : spas, hôtels rares, cures thermales, cosmétique.",
        "url": "https://belaugure.studio/",
        "email": "nicolas@belaugure.studio",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Bordeaux",
          "addressRegion": "Nouvelle-Aquitaine",
          "addressCountry": "FR"
        },
        "areaServed": "FR",
        "knowsAbout": [
          "film de marque",
          "film signature",
          "hôtellerie de luxe",
          "bien-être",
          "cosmétique"
        ]
      }
    </script>
    <!-- Vimeo : la connexion s'établit pendant que la page se charge,
         le film de fond démarre d'autant plus vite -->
    <link rel="preconnect" href="https://player.vimeo.com" />
    <link rel="preconnect" href="https://f.vimeocdn.com" />
    <link rel="preconnect" href="https://i.vimeocdn.com" />
    <link rel="dns-prefetch" href="https://fresnel.vimeocdn.com" />
    <link
      rel="preload"
      href="/fonts/giflika.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Bel Augure · Studio de films signature</title>
    <!-- Mesure d'audience : décommenter après avoir créé le site sur
         plausible.io (sans cookie, conforme à la politique de
         confidentialité annoncée dans les mentions légales).
    <script defer data-domain="belaugure.studio" src="https://plausible.io/js/script.js"></script>
    -->
  </head>
  <body>
    <!-- Voile d'ouverture statique : peint par le navigateur avant même que
         le bundle JS soit téléchargé. Sans lui, une connexion ou une machine
         lente voit un écran blanc au lieu de la salle obscure. React le
         remplace en montant (il vit dans #root) par son propre voile,
         visuellement identique. Sur les vues profondes (#offres…), il est
         masqué immédiatement : pas de voile hors accueil. -->
    <div id="root">
      <div
        id="veil-static"
        style="position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; background: #1a1512"
      >
        <div style="display: flex; flex-direction: column; align-items: center">
          <p
            style="margin: 0; font-family: 'Giflika', 'Didot', 'Bodoni MT', Georgia, serif; font-size: clamp(1.6rem, 3vw, 2.4rem); color: #f2ede4"
          >
            Bel Augure<span style="color: #d9c6a6">.</span>
          </p>
          <span
            style="margin-top: 1.75rem; display: block; height: 1px; width: 11rem; overflow: hidden; background: rgba(242, 237, 228, 0.12)"
          >
            <span
              id="veil-static-bar"
              style="display: block; height: 100%; width: 100%; background: #d9c6a6; transform: scaleX(0); transform-origin: left; transition: transform 2.4s cubic-bezier(0.16, 1, 0.3, 1)"
            ></span>
          </span>
        </div>
      </div>
      <script>
        ;(function () {
          var views = ['films', 'offres', 'studio', 'contact', 'mentions']
          var veil = document.getElementById('veil-static')
          if (views.indexOf(location.hash.slice(1)) !== -1) {
            veil.style.display = 'none'
          } else {
            requestAnimationFrame(function () {
              // React peut avoir déjà remplacé le voile statique par le sien
              var bar = document.getElementById('veil-static-bar')
              if (bar) bar.style.transform = 'scaleX(1)'
            })
          }
        })()
      </script>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
