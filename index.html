<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Bel Augure, studio de films signature en Nouvelle-Aquitaine. Films pensés comme des actifs pour les maisons du bien-être d'exception."
    />
    <meta name="theme-color" content="#f2ede4" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Bel Augure · Studio de films signature" />
    <meta
      property="og:description"
      content="Les films signatures du bien-être d'exception. Studio fondé à Bordeaux, Nouvelle-Aquitaine."
    />
    <meta property="og:locale" content="fr_FR" />
    <link rel="canonical" href="https://belaugure.studio/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Données structurées : le studio comme service local, offres bornées -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Bel Augure",
        "description": "Studio de films signature pour les maisons du bien-être d'exception : hôtels rares, maisons de soin, domaines, cosmétique.",
        "url": "https://belaugure.studio/",
        "email": "nicolas@belaugure.studio",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Bordeaux",
          "addressRegion": "Nouvelle-Aquitaine",
          "addressCountry": "FR"
        },
        "areaServed": "FR",
        "priceRange": "7 000 € - 25 000 €",
        "knowsAbout": [
          "film de marque",
          "film signature",
          "hôtellerie de luxe",
          "bien-être",
          "cosmétique"
        ]
      }
    </script>
    <!-- Vimeo : la connexion s'établit pendant que la page se charge,
         le film de fond démarre d'autant plus vite -->
    <link rel="preconnect" href="https://player.vimeo.com" />
    <link rel="preconnect" href="https://f.vimeocdn.com" />
    <link rel="preconnect" href="https://i.vimeocdn.com" />
    <link rel="dns-prefetch" href="https://fresnel.vimeocdn.com" />
    <link
      rel="preload"
      href="/fonts/giflika.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Bel Augure · Studio de films signature</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
