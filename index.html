    <script defer data-domain="belaugure.studio" src="https://plausible.io/js/script.js"></script>
    -->
  </head>
  <body>
    <!-- Voile d'ouverture statique : peint par le navigateur avant même que
         le bundle JS soit téléchargé. Sans lui, une connexion ou une machine
         lente voit un écran blanc au lieu de la salle obscure. React le
         remplace en montant (il vit dans #root) par son propre voile,
         visuellement identique. Sur les vues profondes (#offres…), il est
         masqué immédiatement : pas de voile hors accueil. -->
    <div id="root">
      <style>
        /* Le point d'or respire pendant l'attente (comme le voile React).
           La barre reste à 0 % : React prend le relais dès son montage et la
           remplit au rythme réel du chargement de la vidéo — pas de saut. */
        @keyframes belDotBreathe {
          from {
            opacity: 0.7;
            transform: scale(0.96);
          }
          to {
            opacity: 1;
            transform: scale(1.06);
          }
        }
      </style>
      <div
        id="veil-static"
        style="position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; background: #1a1512"
      >
        <div style="display: flex; flex-direction: column; align-items: center">
          <p
            style="margin: 0; font-family: 'Giflika', 'Didot', 'Bodoni MT', Georgia, serif; font-size: clamp(1.6rem, 3vw, 2.4rem); color: #f2ede4"
          >
            Bel Augure<span
              style="color: #d9c6a6; display: inline-block; animation: belDotBreathe 5s ease-in-out infinite alternate"
              >.</span
            >
          </p>
          <span
            style="margin-top: 1.75rem; display: block; height: 1px; width: 11rem; overflow: hidden; background: rgba(242, 237, 228, 0.12)"
          >
            <span style="display: block; height: 100%; width: 0%; background: #d9c6a6"></span>
          </span>
        </div>
      </div>
      <script>
        ;(function () {
          var views = ['films', 'offres', 'studio', 'contact', 'mentions']
          var path = location.pathname.replace(/\/+$/, '') || '/'
          var deep =
            path !== '/' || views.indexOf(location.hash.slice(1)) !== -1
          if (deep) {
            document.getElementById('veil-static').style.display = 'none'
          }
        })()
      </script>
      <!--seo-content-->
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
